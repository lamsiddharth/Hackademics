<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Interview — Hackedemics</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #7c6af7;
    --accent-dim: #3d3478;
    --green: #4ade80;
    --red: #f87171;
    --amber: #fbbf24;
    --text: #e2e2f0;
    --muted: #6b6b8a;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 780px;
    position: relative;
    z-index: 1;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
  }

  .logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: var(--mono);
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    transition: all 0.3s;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s;
  }

  .status-pill.connected .status-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-pill.connected { color: var(--green); border-color: rgba(74,222,128,0.2); }
  .status-pill.error .status-dot { background: var(--red); }
  .status-pill.error { color: var(--red); border-color: rgba(248,113,113,0.2); }

  /* ── Setup card ── */
  #setup-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
  }

  .panel-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .panel-sub {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 36px;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
    appearance: none;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--accent); }

  .hidden { display: none; }

  .btn-start {
    width: 100%;
    margin-top: 12px;
    padding: 16px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: white;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-start:hover { background: #9585f9; transform: translateY(-1px); }
  .btn-start:active { transform: translateY(0); }
  .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── Interview panel ── */
  #interview-panel { display: none; }

  .interview-grid {
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 16px;
    min-height: 70vh;
  }

  /* Visualizer */
  .viz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .viz-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .orb-wrapper {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .orb {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #9585f9, var(--accent-dim));
    box-shadow: 0 0 30px rgba(124,106,247,0.3);
    transition: all 0.15s;
    position: relative;
    z-index: 1;
  }

  .orb.listening {
    animation: pulse-orb 1.2s ease-in-out infinite;
    box-shadow: 0 0 50px rgba(124,106,247,0.6);
  }

  .orb.speaking {
    background: radial-gradient(circle at 35% 35%, #6ee7b7, #059669);
    box-shadow: 0 0 50px rgba(74,222,128,0.5);
    animation: pulse-orb 0.8s ease-in-out infinite;
  }

  .orb.waiting {
    opacity: 0.4;
    animation: none;
  }

  @keyframes pulse-orb {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .orb-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(124,106,247,0.2);
    animation: ring-expand 2s ease-out infinite;
  }

  .orb-ring:nth-child(2) { animation-delay: 0.7s; }

  @keyframes ring-expand {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  .orb-state-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* Transcript feed */
  .transcript-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    overflow-y: auto;
    max-height: 380px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .transcript-card:empty::after {
    content: 'Conversation will appear here...';
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin: auto;
    display: block;
    padding: 40px 0;
  }

  .turn {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fade-up 0.3s ease;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .turn-role {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .turn.user .turn-role { color: var(--accent); }
  .turn.assistant .turn-role { color: var(--green); }

  .turn-content {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--bg);
    border-left: 2px solid transparent;
  }

  .turn.user .turn-content { border-left-color: var(--accent); }
  .turn.assistant .turn-content { border-left-color: var(--green); }

  /* Live caption bar */
  .caption-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .caption-bar.active { color: var(--text); border-color: rgba(124,106,247,0.3); }

  .caption-cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
  }

  .btn-mic {
    flex: 1;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-mic:hover { background: rgba(124,106,247,0.1); }
  .btn-mic.recording {
    background: rgba(248,113,113,0.1);
    border-color: var(--red);
    color: var(--red);
    animation: border-pulse 1.5s ease-in-out infinite;
  }

  .btn-mic:disabled { opacity: 0.3; cursor: not-allowed; }

  @keyframes border-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0); }
    50% { box-shadow: 0 0 0 4px rgba(248,113,113,0.15); }
  }

  .btn-end {
    padding: 16px 24px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-end:hover { border-color: var(--red); color: var(--red); background: rgba(248,113,113,0.05); }

  /* Mic icon */
  .mic-icon { font-size: 16px; }

  /* ── Feedback panel ── */
  #feedback-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
  }

  .feedback-title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }

  .feedback-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .feedback-body {
    font-size: 14px;
    line-height: 1.8;
    color: #c8c8e0;
    white-space: pre-wrap;
  }

  .btn-restart {
    margin-top: 32px;
    padding: 14px 28px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-restart:hover { background: rgba(124,106,247,0.1); }

  /* toast */
  .toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--red);
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Webcam preview (PiP) ── */
  .cam-container {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .cam-preview {
    width: 180px;
    height: 135px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    object-fit: cover;
    transform: scaleX(-1);
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    transition: opacity 0.3s, transform 0.3s;
  }

  .cam-preview.hidden-cam {
    opacity: 0;
    transform: scaleX(-1) scale(0.8);
    pointer-events: none;
    height: 0;
    overflow: hidden;
  }

  .cam-toggle {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .cam-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .cam-toggle.active { border-color: var(--green); color: var(--green); }

  /* ── Body language indicators ── */
  .bl-indicators {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    transition: opacity 0.3s;
  }

  .bl-indicators.inactive { opacity: 0.3; }

  .bl-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bl-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .bl-dot.good { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .bl-dot.warn { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .bl-dot.bad { background: var(--red); box-shadow: 0 0 6px var(--red); }

  /* ── Body language feedback section ── */
  .bl-scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 20px;
    margin-bottom: 24px;
  }

  .bl-score-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }

  .bl-score-icon { font-size: 20px; margin-bottom: 6px; }
  .bl-score-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .bl-score-value {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
  }
  .bl-score-value .pct { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">Hackedemics // Interview</div>
    <div class="status-pill" id="status-pill">
      <div class="status-dot"></div>
      <span id="status-text">disconnected</span>
    </div>
  </header>

  <!-- ── Setup ── -->
  <div id="setup-panel">
    <div class="panel-title">Mock Interview</div>
    <div class="panel-sub">// configure your session parameters</div>

    <div class="field">
      <label>Job Role</label>
      <input type="text" id="job-role" value="Backend Engineer" placeholder="e.g. Frontend Engineer, ML Engineer">
    </div>

    <div class="field">
      <label>Prep Mode</label>
      <select id="prep-mode" onchange="toggleProfileFields()">
        <option value="interactive" selected>Interactive — profile-aware, live interview</option>
        <option value="subjective">Subjective — classic 5-question flow</option>
      </select>
    </div>

    <div class="field">
      <label>Difficulty</label>
      <select id="difficulty">
        <option value="easy">Easy — conceptual, broad questions</option>
        <option value="medium" selected>Medium — standard interview depth</option>
        <option value="hard">Hard — system design + deep dives</option>
      </select>
    </div>

    <div id="profile-fields">
      <div class="field">
        <label>Target Role</label>
        <input type="text" id="target-role" placeholder="e.g. Backend Engineer">
      </div>

      <div class="field">
        <label>Target Company</label>
        <input type="text" id="target-company" placeholder="e.g. Stripe">
      </div>

      <div class="field">
        <label>Tech Stack</label>
        <input type="text" id="tech-stack" placeholder="e.g. Python, FastAPI, Postgres">
      </div>

      <div class="field">
        <label>Current Profile</label>
        <textarea id="current-profile" rows="3" placeholder="e.g. 2 years backend, fintech, REST APIs"></textarea>
      </div>
    </div>

    <button class="btn-start" id="btn-start" onclick="startSession()">
      Start Interview →
    </button>
  </div>

  <!-- ── Interview ── -->
  <div id="interview-panel">
    <div class="interview-grid">

      <div class="viz-card">
        <div class="viz-label" id="viz-label">initializing</div>
        <div class="orb-wrapper">
          <div class="orb-ring"></div>
          <div class="orb-ring"></div>
          <div class="orb waiting" id="orb"></div>
        </div>
        <div class="orb-state-text" id="orb-state">connecting to pipeline...</div>

        <div class="bl-indicators inactive" id="bl-indicators">
          <div class="bl-indicator">
            <div class="bl-dot" id="bl-eye-dot"></div>
            <span id="bl-eye-label">eye contact</span>
          </div>
          <div class="bl-indicator">
            <div class="bl-dot" id="bl-head-dot"></div>
            <span id="bl-head-label">head pose</span>
          </div>
          <div class="bl-indicator">
            <div class="bl-dot" id="bl-expr-dot"></div>
            <span id="bl-expr-label">expression</span>
          </div>
        </div>
      </div>

      <div class="transcript-card" id="transcript-feed"></div>

      <div class="caption-bar" id="caption-bar">
        waiting for audio...
      </div>

      <div class="controls">
        <button class="btn-mic" id="btn-mic" disabled onclick="toggleMic()">
          <span class="mic-icon">🎙</span>
          <span id="btn-mic-text">Hold to Speak</span>
        </button>
        <button class="btn-end" onclick="endSession()">End Session</button>
      </div>

    </div>
  </div>

  <!-- ── Feedback ── -->
  <div id="feedback-panel">
    <div class="feedback-title">Interview Complete</div>
    <div class="feedback-meta" id="feedback-meta"></div>

    <div class="bl-scores" id="bl-scores" style="display:none;">
      <div class="bl-score-card">
        <div class="bl-score-icon">👁️</div>
        <div class="bl-score-label">Eye Contact</div>
        <div class="bl-score-value" id="bl-final-eye">—</div>
      </div>
      <div class="bl-score-card">
        <div class="bl-score-icon">🎭</div>
        <div class="bl-score-label">Expressions</div>
        <div class="bl-score-value" id="bl-final-expr">—</div>
      </div>
      <div class="bl-score-card">
        <div class="bl-score-icon">🧠</div>
        <div class="bl-score-label">Head Stability</div>
        <div class="bl-score-value" id="bl-final-head">—</div>
      </div>
    </div>

    <div class="feedback-body" id="feedback-body">Loading feedback...</div>
    <div id="feedback-actions" style="display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;">
      <button class="btn-restart" onclick="location.reload()">Start New Session</button>
      <button class="btn-restart" id="btn-generate-report" style="display:none;" onclick="retryReport()">Generate Report</button>
      <button class="btn-restart" id="btn-view-history" onclick="window.location.href='/mock-interview/history/'">View History</button>
    </div>
  </div>

  <!-- ── Webcam PiP ── -->
  <div class="cam-container" id="cam-container" style="display:none;">
    <video id="cam-preview" class="cam-preview" autoplay playsinline muted></video>
    <button class="cam-toggle active" id="cam-toggle" onclick="toggleCamPreview()" title="Toggle camera preview">👁</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- AudioWorklet processor — inline as blob URL -->
<script id="worklet-src" type="text/worklet">
class PCMProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this._active = true;
    this.port.onmessage = (e) => {
      if (e.data === 'stop') this._active = false;
    };
  }

  process(inputs) {
    if (!this._active) return false;
    const input = inputs[0];
    if (!input || !input[0]) return true;

    const float32 = input[0];
    // downsample 44100 → 16000 (ratio ≈ 2.75625)
    const ratio    = sampleRate / 16000;
    const outLen   = Math.floor(float32.length / ratio);
    const int16    = new Int16Array(outLen);

    for (let i = 0; i < outLen; i++) {
      const srcIdx = Math.floor(i * ratio);
      const sample = Math.max(-1, Math.min(1, float32[srcIdx]));
      int16[i] = sample < 0 ? sample * 32768 : sample * 32767;
    }

    this.port.postMessage(int16.buffer, [int16.buffer]);
    return true;
  }
}
registerProcessor('pcm-processor', PCMProcessor);
</script>

<script type="module">
// ─── MediaPipe imports ───────────────────────────────────────────────────
import { FaceLandmarker, FilesetResolver } from
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs';

// ─── Expose to global scope for inline onclick handlers ──────────────────
window.startSession    = startSession;
window.endSession      = endSession;
window.toggleMic       = toggleMic;
window.retryReport     = retryReport;
window.toggleProfileFields = toggleProfileFields;
window.toggleCamPreview = toggleCamPreview;

// ─── State ───────────────────────────────────────────────────────────────
let ws            = null;
let sessionId     = null;
let audioCtx      = null;
let workletNode   = null;
let micStream     = null;
let isRecording   = false;
let canRecord     = false;   // true only when interviewer finished speaking
let audioQueue    = [];      // incoming PCM chunks from Kokoro
let isPlaying     = false;

// ─── MediaPipe state ─────────────────────────────────────────────────────
let faceLandmarker   = null;
let camStream        = null;
let camEnabled       = false;    // true if user granted camera
let detectionLoop    = null;     // interval ID
let camPreviewVisible = true;

// Metric accumulators
let blFrames         = 0;        // total frames analyzed
let eyeContactFrames = 0;        // frames with good eye contact
let headYawSamples   = [];       // absolute yaw values per frame
let headPitchSamples = [];
let nodDetector      = { prev: null, direction: null, count: 0 };
let exprCounts       = {};       // { smile: N, neutral: N, ... }
let sessionStartTime = 0;

// ─── Django CSRF ──────────────────────────────────────────────────────────
function getCookie(name) {
  const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return v ? v.pop() : '';
}

// ─── Toast ────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ─── Status pill ──────────────────────────────────────────────────────────
function setStatus(state, label) {
  const pill = document.getElementById('status-pill');
  const text = document.getElementById('status-text');
  pill.className = 'status-pill ' + state;
  text.textContent = label;
}

// ─── Orb state ────────────────────────────────────────────────────────────
function setOrb(state, label, sublabel) {
  const orb   = document.getElementById('orb');
  const vizL  = document.getElementById('viz-label');
  const orbS  = document.getElementById('orb-state');
  orb.className = 'orb ' + state;
  if (label)   vizL.textContent = label;
  if (sublabel) orbS.textContent = sublabel;
}

// ─── Transcript feed ──────────────────────────────────────────────────────
function addTurn(role, content) {
  const feed = document.getElementById('transcript-feed');
  const div  = document.createElement('div');
  div.className = 'turn ' + role;
  div.innerHTML = `
    <div class="turn-role">${role === 'user' ? '// you' : '// interviewer'}</div>
    <div class="turn-content">${content}</div>
  `;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function setCaption(text, active) {
  const bar = document.getElementById('caption-bar');
  bar.className = 'caption-bar' + (active ? ' active' : '');
  bar.innerHTML = active
    ? text + '<span class="caption-cursor"></span>'
    : text;
}

// ─── Step 1: Django → get session_id + ws_url ────────────────────────────
async function startSession() {
  const btn      = document.getElementById('btn-start');
  const prepMode = document.getElementById('prep-mode').value;
  const targetRole = document.getElementById('target-role').value.trim();
  const targetCompany = document.getElementById('target-company').value.trim();
  const techStack = document.getElementById('tech-stack').value.trim();
  const currentProfile = document.getElementById('current-profile').value.trim();
  let jobRole  = document.getElementById('job-role').value.trim();
  const diff     = document.getElementById('difficulty').value;

  if (!jobRole && targetRole) jobRole = targetRole;
  if (!jobRole) jobRole = 'Software Engineer';

  btn.disabled   = true;
  btn.textContent = 'Starting...';

  try {
    const resp = await fetch('/mock-interview/start/', {
      method:  'POST',
      headers: {
        'Content-Type':  'application/json',
        'X-CSRFToken':   getCookie('csrftoken'),
      },
      body: JSON.stringify({
        job_role: jobRole,
        difficulty: diff,
        prep_mode: prepMode,
        target_role: prepMode === 'interactive' ? targetRole : undefined,
        target_company: prepMode === 'interactive' ? targetCompany : undefined,
        tech_stack: prepMode === 'interactive' ? techStack : undefined,
        current_profile: prepMode === 'interactive' ? currentProfile : undefined,
      }),
    });

    if (!resp.ok) throw new Error(`Django returned ${resp.status}`);

    const data = await resp.json();
    sessionId  = data.session_id;

    document.getElementById('setup-panel').style.display     = 'none';
    document.getElementById('interview-panel').style.display = 'block';

    // Start MediaPipe + webcam (non-blocking — interview works even if camera fails)
    initMediaPipe().catch(e => console.warn('[MediaPipe] init failed:', e));

    connectWebSocket(data.ws_url);

  } catch (err) {
    showToast('Failed to start session: ' + err.message);
    btn.disabled    = false;
    btn.textContent = 'Start Interview →';
  }
}

function toggleProfileFields() {
  const prepMode = document.getElementById('prep-mode').value;
  const fields = document.getElementById('profile-fields');
  if (prepMode === 'interactive') {
    fields.classList.remove('hidden');
  } else {
    fields.classList.add('hidden');
  }
}

document.addEventListener('DOMContentLoaded', toggleProfileFields);

// ─── Step 2: FastAPI WebSocket ────────────────────────────────────────────
function connectWebSocket(wsUrl) {
  setOrb('waiting', 'connecting', 'opening pipeline...');
  setStatus('', 'connecting...');

  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
  setStatus('connected', 'connected');
  setOrb('speaking', 'interviewer', 'asking first question...');
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('PING'); }, 20000);

  // Fallback — unlock mic after 30s if END_OF_RESPONSE never arrives
  setTimeout(() => {
    if (!canRecord && !isRecording) {
      console.warn('END_OF_RESPONSE timeout — unlocking mic manually');
      canRecord = true;
      document.getElementById('btn-mic').disabled = false;
      setOrb('waiting', 'your turn', 'click to speak');
      setCaption('ready for your answer', false);
      }
    }, 30000);
  };

  ws.onmessage = (event) => {
    console.log('[ws] message', event.data);
    // Binary = PCM audio from Kokoro
    if (event.data instanceof ArrayBuffer) {
      audioQueue.push(event.data);
      if (!isPlaying) playNextChunk();
      return;
    }

    const msg = event.data;
    if (typeof msg === 'string') {
      try {
        const parsed = JSON.parse(msg);
        if (parsed && typeof parsed === 'object') {
          if (parsed.type === 'assistant' || parsed.event === 'assistant') {
            addTurn('assistant', parsed.content || parsed.text || '');
            return;
          }
          if (parsed.type === 'transcript' || parsed.event === 'transcript') {
            const transcript = parsed.content || parsed.text || '';
            if (transcript) {
              setCaption(transcript, true);
              addTurn('user', transcript);
              return;
            }
          }
        }
      } catch (_) {
        // Not JSON, continue with string handling.
      }
    }

    if (msg === 'PONG') return;

    if (msg === 'END_OF_RESPONSE') {
      // Interviewer finished speaking — enable mic
      canRecord = true;
      document.getElementById('btn-mic').disabled = false;
      setOrb('waiting', 'your turn', 'press and hold to speak');
      setCaption('press and hold the mic button to answer', false);
      return;
    }

    if (msg === 'SESSION_END') {
      setOrb('waiting', 'complete', 'interview finished');
      setStatus('', 'session ended');
      pollForFeedback();
      return;
    }

    if (msg.startsWith('TRANSCRIPT:')) {
      const transcript = msg.slice(11);
      setCaption(transcript, true);
      // Add to feed when we get the final transcript
      addTurn('user', transcript);
      return;
    }
    
    if (msg.startsWith('ASSISTANT:')) {
      addTurn('assistant', msg.slice(10));
      return;
    }

    if (typeof msg === 'string' && msg.trim()) {
      addTurn('assistant', msg);
      return;
    }
  };

  ws.onerror = () => {
    setStatus('error', 'error');
    showToast('WebSocket error — check FastAPI server');
  };

  ws.onclose = () => {
    setStatus('error', 'disconnected');
    canRecord = false;
    document.getElementById('btn-mic').disabled = true;
  };
}

// ─── Audio playback (PCM-16, 24000 Hz) ───────────────────────────────────
async function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new AudioContext({ sampleRate: 24000 });
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();
}

async function playNextChunk() {
  if (audioQueue.length === 0) {
    isPlaying = false;
    return;
  }

  isPlaying = true;
  setOrb('speaking', 'interviewer', 'speaking...');
  setCaption('interviewer is speaking...', false);

  await ensureAudioCtx();

  const raw    = audioQueue.shift();
  const int16  = new Int16Array(raw);
  const float32 = new Float32Array(int16.length);

  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 32768.0;
  }

  const buffer = audioCtx.createBuffer(1, float32.length, 24000);
  buffer.copyToChannel(float32, 0);

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);
  source.onended = playNextChunk;
  source.start();
}

// ─── Mic recording via AudioWorklet ──────────────────────────────────────
async function initWorklet() {
  if (workletNode) return;

  await ensureAudioCtx();

  // Inline as plain string — avoids blob URL issues in Edge/Chromium on Linux
  const processorCode = `
    class PCMProcessor extends AudioWorkletProcessor {
      constructor() {
        super();
        this._active = true;
        this.port.onmessage = (e) => {
          if (e.data === 'stop') this._active = false;
        };
      }
      process(inputs) {
        if (!this._active) return false;
        const input = inputs[0];
        if (!input || !input[0]) return true;
        const float32 = input[0];
        const ratio   = sampleRate / 16000;
        const outLen  = Math.floor(float32.length / ratio);
        const int16   = new Int16Array(outLen);
        for (let i = 0; i < outLen; i++) {
          const s = Math.max(-1, Math.min(1, float32[Math.floor(i * ratio)]));
          int16[i] = s < 0 ? s * 32768 : s * 32767;
        }
        this.port.postMessage(int16.buffer, [int16.buffer]);
        return true;
      }
    }
    registerProcessor('pcm-processor', PCMProcessor);
  `;

  const blob = new Blob([processorCode], { type: 'application/javascript' });
  const url  = URL.createObjectURL(blob);

  try {
    await audioCtx.audioWorklet.addModule(url);
  } catch(e) {
    console.error('Worklet load failed:', e);
    throw new Error('AudioWorklet failed to load: ' + e.message);
  } finally {
    URL.revokeObjectURL(url);
  }

  micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  const src = audioCtx.createMediaStreamSource(micStream);

  workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor');
  workletNode.port.onmessage = (e) => {
    if (ws && ws.readyState === 1 && isRecording) {
      ws.send(e.data);
    }
  };

  src.connect(workletNode);
}

async function toggleMic() {
  console.log('toggleMic called', { canRecord, isRecording });

  if (!isRecording) {
    // Only check canRecord when STARTING a new turn, not when stopping
    if (!canRecord) {
      showToast('Wait for interviewer to finish speaking');
      return;
    }
    // Explicitly test mic permission before touching AudioWorklet
    try {
      const test = await navigator.mediaDevices.getUserMedia({ audio: true });
      test.getTracks().forEach(t => t.stop());
    } catch(e) {
      showToast('Mic blocked — allow localhost in Edge: edge://settings/content/microphone');
      return;
    }

    try {
      await initWorklet();
    } catch (err) {
      showToast('Mic error: ' + err.message);
      console.error('initWorklet failed:', err);
      return;
    }

    isRecording = true;
    canRecord   = false;

    const btn = document.getElementById('btn-mic');
    btn.classList.add('recording');
    document.getElementById('btn-mic-text').textContent = 'Listening... Click to send';
    setOrb('listening', 'listening', 'speak your answer...');
    setCaption('listening...', true);

  } else {
    isRecording = false;

    // Stop the worklet first
    if (workletNode) {
      workletNode.port.postMessage('stop');
      workletNode = null;
    }

    // Stop mic tracks to release the mic indicator in browser
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }

    // Tell FastAPI this turn is over — triggers clean STT close
    if (ws && ws.readyState === 1) {
      ws.send('STOP_RECORDING');
    }

    const btn = document.getElementById('btn-mic');
    btn.classList.remove('recording');
    btn.disabled = true;
    document.getElementById('btn-mic-text').textContent = 'Hold to Speak';

    setOrb('speaking', 'processing', 'transcribing...');
    setCaption('processing your answer...', false);
  }
}

// ─── End session ──────────────────────────────────────────────────────────
async function endSession() {
  // Stop MediaPipe detection
  stopMediaPipe();

  // Send body language metrics to Django before closing
  if (camEnabled && sessionId) {
    const metrics = getAggregatedMetrics();
    try {
      await fetch(`/mock-interview/end-body-language/${sessionId}/`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken'),
        },
        body: JSON.stringify(metrics),
      });
    } catch (e) {
      console.warn('[MediaPipe] failed to send metrics:', e);
    }
  }

  if (ws) ws.close();
  // Show final body language scores in feedback panel
  if (camEnabled) {
    displayFinalScores();
  }
  pollForFeedback();
}

// ─── Poll Django for feedback ─────────────────────────────────────────────
async function pollForFeedback() {
  if (!sessionId) return;

  document.getElementById('interview-panel').style.display = 'none';
  document.getElementById('feedback-panel').style.display  = 'block';

  let attempts = 0;
  const max    = 30;

  const poll = async () => {
    attempts++;
    try {
      const resp = await fetch(`/mock-interview/results/${sessionId}/`);
      const data = await resp.json();

      if (data.ready) {
        document.getElementById('feedback-meta').textContent =
          `${data.job_role}  ·  ${data.difficulty}  ·  ${data.prep_mode}  ·  ${new Date(data.created_at).toLocaleString()}`;

        if (data.has_feedback && data.feedback) {
          document.getElementById('feedback-body').textContent = data.feedback;
        } else {
          // Transcript saved but feedback generation failed — auto-retry
          document.getElementById('feedback-body').textContent =
            'Interview transcript saved. Generating your report...';
          triggerReportGeneration();
        }
        return;
      }
    } catch (_) {}

    if (attempts < max) setTimeout(poll, 1500);
    else {
      document.getElementById('feedback-body').textContent =
        'Feedback is taking longer than expected. You can try generating the report manually.';
      document.getElementById('btn-generate-report').style.display = 'inline-block';
    }
  };

  setTimeout(poll, 2500);
}

// ─── Trigger report generation ────────────────────────────────────────
async function triggerReportGeneration() {
  if (!sessionId) return;

  document.getElementById('feedback-body').textContent = 'Generating detailed report...';

  try {
    const resp = await fetch(`/mock-interview/report/${sessionId}/`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken'),
      },
    });
    const data = await resp.json();

    if (resp.ok && data.feedback) {
      document.getElementById('feedback-body').textContent = data.feedback;
    } else {
      document.getElementById('feedback-body').textContent =
        'Report generation failed: ' + (data.error || 'Unknown error') + '\nYou can retry using the button below.';
      document.getElementById('btn-generate-report').style.display = 'inline-block';
    }
  } catch (err) {
    document.getElementById('feedback-body').textContent =
      'Could not generate report. Check your connection and try again.';
    document.getElementById('btn-generate-report').style.display = 'inline-block';
  }
}

async function retryReport() {
  document.getElementById('btn-generate-report').style.display = 'none';
  await triggerReportGeneration();
}

// ═══════════════════════════════════════════════════════════════════════════
// ─── MediaPipe: Face Landmarker integration ──────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════

async function initMediaPipe() {
  console.log('[MediaPipe] initializing...');
  const video = document.getElementById('cam-preview');

  // 1. Request camera
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { width: 320, height: 240, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = camStream;
    await video.play();
  } catch (e) {
    console.warn('[MediaPipe] Camera denied or unavailable:', e);
    camEnabled = false;
    return; // Graceful degradation — voice-only interview
  }

  camEnabled = true;
  document.getElementById('cam-container').style.display = 'flex';
  document.getElementById('bl-indicators').classList.remove('inactive');

  // 2. Load Face Landmarker model
  try {
    const filesetResolver = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm'
    );
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: 'GPU',
      },
      runningMode: 'VIDEO',
      numFaces: 1,
      outputFaceBlendshapes: true,
      outputFacialTransformationMatrixes: true,
    });
    console.log('[MediaPipe] Face Landmarker ready');
  } catch (e) {
    console.error('[MediaPipe] Model load failed:', e);
    camEnabled = false;
    return;
  }

  // 3. Start detection loop at ~10fps
  sessionStartTime = performance.now();
  detectionLoop = setInterval(() => runDetection(video), 100);
}

function runDetection(video) {
  if (!faceLandmarker || video.readyState < 2) return;

  const timestamp = performance.now();
  let result;
  try {
    result = faceLandmarker.detectForVideo(video, timestamp);
  } catch (e) {
    return; // skip frame on error
  }

  if (!result || !result.faceLandmarks || result.faceLandmarks.length === 0) return;

  blFrames++;
  const landmarks = result.faceLandmarks[0];

  // ── Eye contact detection ──────────────────────────────────────────
  const isLooking = computeEyeContact(landmarks);
  if (isLooking) eyeContactFrames++;

  // ── Head pose (yaw/pitch from key landmarks) ───────────────────────
  const headPose = computeHeadPose(landmarks);
  headYawSamples.push(Math.abs(headPose.yaw));
  headPitchSamples.push(Math.abs(headPose.pitch));

  // ── Nod detection (pitch oscillation) ──────────────────────────────
  detectNod(headPose.pitch);

  // ── Expression extraction ──────────────────────────────────────────
  if (result.faceBlendshapes && result.faceBlendshapes.length > 0) {
    const expr = getDominantExpression(result.faceBlendshapes[0].categories);
    exprCounts[expr] = (exprCounts[expr] || 0) + 1;
  }

  // ── Update real-time indicators ────────────────────────────────────
  updateIndicators(isLooking, headPose, result.faceBlendshapes);
}

// ── Eye contact: check if iris is centered in the eye ────────────────────
function computeEyeContact(lm) {
  // Left eye: outer corner = 33, inner corner = 133, iris center = 468
  // Right eye: inner corner = 362, outer corner = 263, iris center = 473
  // If landmarks < 474, iris landmarks not available → skip
  if (lm.length < 474) return false;

  const leftOuter  = lm[33];
  const leftInner  = lm[133];
  const leftIris   = lm[468];
  const rightInner = lm[362];
  const rightOuter = lm[263];
  const rightIris  = lm[473];

  // Compute horizontal ratio: 0 = outer corner, 1 = inner corner, 0.5 = center
  const leftEyeWidth = Math.sqrt(
    (leftInner.x - leftOuter.x) ** 2 + (leftInner.y - leftOuter.y) ** 2
  );
  const leftIrisPos = Math.sqrt(
    (leftIris.x - leftOuter.x) ** 2 + (leftIris.y - leftOuter.y) ** 2
  );
  const leftRatio = leftEyeWidth > 0 ? leftIrisPos / leftEyeWidth : 0.5;

  const rightEyeWidth = Math.sqrt(
    (rightOuter.x - rightInner.x) ** 2 + (rightOuter.y - rightInner.y) ** 2
  );
  const rightIrisPos = Math.sqrt(
    (rightIris.x - rightInner.x) ** 2 + (rightIris.y - rightInner.y) ** 2
  );
  const rightRatio = rightEyeWidth > 0 ? rightIrisPos / rightEyeWidth : 0.5;

  const avgRatio = (leftRatio + rightRatio) / 2;

  // "Looking at camera" if iris is within 0.35-0.65 of eye width (centered)
  return avgRatio >= 0.35 && avgRatio <= 0.65;
}

// ── Head pose from nose tip + forehead + chin landmarks ──────────────────
function computeHeadPose(lm) {
  // Using key landmarks: nose tip (1), chin (152), left cheek (234), right cheek (454)
  const nose = lm[1];
  const chin = lm[152];
  const leftCheek = lm[234];
  const rightCheek = lm[454];

  // Yaw: asymmetry between nose and midpoint of cheeks (+ = turned right)
  const cheekMidX = (leftCheek.x + rightCheek.x) / 2;
  const yaw = (nose.x - cheekMidX) * 180; // rough degrees

  // Pitch: nose-to-chin vertical ratio relative to face height
  const faceHeight = Math.abs(chin.y - lm[10].y); // forehead (10) to chin
  const noseRelative = (nose.y - lm[10].y) / (faceHeight || 1);
  const pitch = (noseRelative - 0.55) * 180; // centered around neutral

  return { yaw, pitch };
}

// ── Nod detection: pitch oscillation ─────────────────────────────────────
function detectNod(pitch) {
  if (nodDetector.prev === null) {
    nodDetector.prev = pitch;
    return;
  }

  const delta = pitch - nodDetector.prev;
  const threshold = 3; // degrees

  if (delta > threshold && nodDetector.direction !== 'down') {
    if (nodDetector.direction === 'up') nodDetector.count++;
    nodDetector.direction = 'down';
  } else if (delta < -threshold && nodDetector.direction !== 'up') {
    nodDetector.direction = 'up';
  }

  nodDetector.prev = pitch;
}

// ── Expression extraction from blendshapes ───────────────────────────────
function getDominantExpression(categories) {
  // Map blendshapes to high-level expression labels
  const expressionMap = {
    'mouthSmileLeft': 'smile', 'mouthSmileRight': 'smile',
    'browDownLeft': 'brow_furrow', 'browDownRight': 'brow_furrow',
    'browInnerUp': 'surprise',
    'jawOpen': 'speaking',
    'eyeSquintLeft': 'squint', 'eyeSquintRight': 'squint',
    'mouthFrownLeft': 'frown', 'mouthFrownRight': 'frown',
  };

  let bestExpr = 'neutral';
  let bestScore = 0.15; // minimum threshold to not be "neutral"

  for (const cat of categories) {
    const mapped = expressionMap[cat.categoryName];
    if (mapped && cat.score > bestScore) {
      bestScore = cat.score;
      bestExpr = mapped;
    }
  }

  return bestExpr;
}

// ── Update real-time UI indicators ───────────────────────────────────────
function updateIndicators(isLooking, headPose, blendshapes) {
  // Eye contact dot
  const eyeDot = document.getElementById('bl-eye-dot');
  eyeDot.className = 'bl-dot ' + (isLooking ? 'good' : 'warn');

  // Head pose dot
  const headDot = document.getElementById('bl-head-dot');
  const absYaw = Math.abs(headPose.yaw);
  const absPitch = Math.abs(headPose.pitch);
  if (absYaw < 10 && absPitch < 10) {
    headDot.className = 'bl-dot good';
  } else if (absYaw < 20 && absPitch < 20) {
    headDot.className = 'bl-dot warn';
  } else {
    headDot.className = 'bl-dot bad';
  }

  // Expression dot + label
  const exprDot = document.getElementById('bl-expr-dot');
  const exprLabel = document.getElementById('bl-expr-label');
  if (blendshapes && blendshapes.length > 0) {
    const expr = getDominantExpression(blendshapes[0].categories);
    exprLabel.textContent = expr;
    if (expr === 'smile') {
      exprDot.className = 'bl-dot good';
    } else if (expr === 'neutral' || expr === 'speaking') {
      exprDot.className = 'bl-dot';
    } else {
      exprDot.className = 'bl-dot warn';
    }
  }
}

// ── Webcam preview toggle ────────────────────────────────────────────────
function toggleCamPreview() {
  const video = document.getElementById('cam-preview');
  const btn = document.getElementById('cam-toggle');
  camPreviewVisible = !camPreviewVisible;

  if (camPreviewVisible) {
    video.classList.remove('hidden-cam');
    btn.classList.add('active');
  } else {
    video.classList.add('hidden-cam');
    btn.classList.remove('active');
  }
}

// ── Stop MediaPipe + camera ──────────────────────────────────────────────
function stopMediaPipe() {
  if (detectionLoop) {
    clearInterval(detectionLoop);
    detectionLoop = null;
  }
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
  document.getElementById('cam-container').style.display = 'none';
}

// ── Aggregate metrics for Django ─────────────────────────────────────────
function getAggregatedMetrics() {
  const eyePct = blFrames > 0 ? Math.round((eyeContactFrames / blFrames) * 100 * 10) / 10 : 0;

  // Head stability: % of frames where yaw < 15° and pitch < 15°
  let stableFrames = 0;
  for (let i = 0; i < headYawSamples.length; i++) {
    if (headYawSamples[i] < 15 && headPitchSamples[i] < 15) stableFrames++;
  }
  const headStabilityPct = blFrames > 0 ? Math.round((stableFrames / blFrames) * 100 * 10) / 10 : 0;

  // Dominant expressions as percentages
  const exprTotal = Object.values(exprCounts).reduce((a, b) => a + b, 0) || 1;
  const dominantExpressions = {};
  for (const [k, v] of Object.entries(exprCounts)) {
    dominantExpressions[k] = Math.round((v / exprTotal) * 100);
  }

  return {
    camera_enabled: true,
    eye_contact_pct: eyePct,
    head_stability_pct: headStabilityPct,
    nod_count: nodDetector.count,
    dominant_expressions: dominantExpressions,
    total_frames: blFrames,
  };
}

// ── Display final scores in feedback panel ────────────────────────────────
function displayFinalScores() {
  const metrics = getAggregatedMetrics();

  document.getElementById('bl-scores').style.display = 'grid';
  document.getElementById('bl-final-eye').innerHTML =
    `${metrics.eye_contact_pct}<span class="pct">%</span>`;
  document.getElementById('bl-final-head').innerHTML =
    `${metrics.head_stability_pct}<span class="pct">%</span>`;

  // Find most common expression (excluding neutral and speaking)
  const meaningful = Object.entries(metrics.dominant_expressions)
    .filter(([k]) => k !== 'neutral' && k !== 'speaking')
    .sort((a, b) => b[1] - a[1]);
  const topExpr = meaningful.length > 0 ? meaningful[0][0] : 'neutral';
  const exprEmojis = { smile: '😊', brow_furrow: '😟', surprise: '😮', squint: '😑', frown: '😔', neutral: '😐' };
  document.getElementById('bl-final-expr').innerHTML =
    `${exprEmojis[topExpr] || '😐'} <span class="pct">${topExpr}</span>`;
}

// ─── DOMContentLoaded setup ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', toggleProfileFields);
</script>
